services:
    localkit:
        container_name: Localkit
        ports:
            - 8080:80
            - 8081:443
        build:
            context: .
            dockerfile: Dockerfile
        networks:
            localkit:

        volumes:
            - ./:/var/www/html/
        environment:
            - APP_TIMEZONE=Europe/Berlin
            - DB_CONNECTION=sqlite
            - DB_DATABASE=/var/www/html/storage/localkit.sqlite
            - LOCALKIT_GO2RTC_ENABLE=true
            - PETKIT_LOCAL_IP=10.10.46.105
            - LOCALKIT_BROKER_HOST=localkit-broker
            - LOCALKIT_BROKER_PORT=443
            - HOMEASSISTANT_PORT=1883
            - HOMEASSISTANT_HOST=10.10.50.10
            - HOMEASSISTANT_CLIENT_ID=localkit_dev
            - BYPASS_AUTH=true
            - BYPASS_AUTH_ID=true
        restart: always

    localkit-broker:
        image: ghcr.io/dwyschka/localkit-broker:main
        ports:
            - 8443:443
        container_name: localkit-broker
        networks:
            localkit:
        restart: always
        environment:
            - LOCALKIT=http://localkit

    seaweedfs:
        image: chrislusf/seaweedfs:latest
        container_name: seaweedfs
        entrypoint: >
            sh -c "
            weed server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data -master.volumeSizeLimitMB=1024 -ip=seaweedfs -filer=true &
            until weed shell -filer=localhost:8888 -c 'fs.mkdir /buckets/localkit' >/dev/null 2>&1; do sleep 1; done;
            wait
            "
        ports:
            - 9333:9333
            - 8888:8888
            - 8333:8333
        volumes:
            - seaweedfs-data:/data
            - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
        networks:
            localkit:
        restart: always

volumes:
    localkit-storage:
    localkit-logs:
    seaweedfs-data:

networks:
    localkit:
