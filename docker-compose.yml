services:
    localkit:
        container_name: Localkit
        ports:
            - 8080:80
            - 8081:443
        build:
            context: .
            dockerfile: Dockerfile
        networks:
            localkit:

        volumes:
            - ./:/var/www/html/
        environment:
            - APP_TIMEZONE=Europe/Berlin
            - DB_CONNECTION=sqlite
            - DB_DATABASE=/var/www/html/storage/localkit.sqlite
            - LOCALKIT_GO2RTC_ENABLE=true
            - PETKIT_LOCAL_IP=10.10.46.105
            - LOCALKIT_BROKER_HOST=localkit-broker
            - LOCALKIT_BROKER_PORT=443
            - HOMEASSISTANT_PORT=1883
            - HOMEASSISTANT_HOST=10.10.50.10
            - HOMEASSISTANT_CLIENT_ID=localkit_dev
            - BYPASS_AUTH=true
            - BYPASS_AUTH_ID=true
            # Device object storage (dev_oss_sts_info_new_v2) backed by Garage S3
            - LOCALKIT_STORAGE_ENABLE=true
            # Base URL the camera uses to reach the OCI emulation. Must be the
            # LAN address of this host as seen by the device.
            - LOCALKIT_STORAGE_ENDPOINT=http://10.10.46.105
            - LOCALKIT_S3_ENDPOINT=http://localkit-storage:3900
            - LOCALKIT_S3_REGION=garage
            - LOCALKIT_S3_BUCKET=localkit
            - LOCALKIT_S3_KEY=GKe1fd06e4975f7148c6f4359fa9d50163
            - LOCALKIT_S3_SECRET=b2ebda94643d392065f5381599e6db2a1a87367786742dfce9aac56e4904d9ab
        depends_on:
            - localkit-storage
        restart: always

    localkit-broker:
        image: ghcr.io/dwyschka/localkit-broker:main
        ports:
            - 8443:443
        container_name: localkit-broker
        networks:
            localkit:
        restart: always
        environment:
            - LOCALKIT=http://localkit

    localkit-storage:
        image: dxflrs/garage:v2.3.0
        container_name: garage
        restart: unless-stopped
        command: /garage server --single-node --default-bucket
        ports:
            - 3900:3900   # S3 API
            - 3903:3903   # Admin API
        networks:
            localkit:
        volumes:
            - ./s3/garage.toml:/etc/garage.toml:ro   # Config (Bind-Mount, read-only)
            - ./s3/meta:/var/lib/garage/meta    # Metadaten
            - ./s3/data:/var/lib/garage/data    # Objektdaten (die eigentlichen Dateien)
        environment:
            # Seit v2.3.0: legt beim ersten Start automatisch Layout,
            # Key und Bucket an. Diese Credentials nutzt du im S3-Client.
            GARAGE_DEFAULT_ACCESS_KEY: "GKe1fd06e4975f7148c6f4359fa9d50163"
            GARAGE_DEFAULT_SECRET_KEY: "b2ebda94643d392065f5381599e6db2a1a87367786742dfce9aac56e4904d9ab"
            GARAGE_DEFAULT_BUCKET: "localkit"
            GARAGE_RPC_SECRET: "c3a420b7e56ef9af4f10cdc7fd63ce85ea3bbc0d01ca25c8f9b599b4758c3bea"
            GARAGE_ADMIN_TOKEN: "VAzx8x90il2aqyJxTmPksAKEmbjyEIQae/g7VC+rnXk="
            GARAGE_METRICS_TOKEN: "5Y4IRSRx3FVcrwsTFWPYf0s1qUPZCoZ1w2h5oERyLtI="
volumes:
    localkit-storage:
    localkit-logs:

networks:
    localkit:
